services:
  postgres:
    image: postgres:16-alpine
    container_name: polleria_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: polleria_finanzas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Lima
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polleria_finanzas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
